<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alpha Auron Recruitment Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--primary:#d10000;
--dark:#111;
--light:#ffffff;
--gray:#f5f7fa;
}

body{
background:var(--gray);
color:#222;
}

/* NAVBAR */

nav{
position:fixed;
top:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 8%;
box-shadow:0 2px 15px rgba(0,0,0,.08);
z-index:1000;
}

.logo img{
height:60px;
}

.dropdown{
position:relative;
}

.menu-btn{
background:var(--primary);
color:#fff;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.dropdown-content{
display:none;
position:absolute;
right:0;
top:50px;
background:white;
min-width:180px;
border-radius:12px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.dropdown-content a{
display:block;
padding:14px 18px;
text-decoration:none;
color:#222;
}

.dropdown-content a:hover{
background:#f4f4f4;
}

.dropdown:hover .dropdown-content{
display:block;
}

/* HERO */

.hero{
padding:140px 8% 80px;
background:linear-gradient(135deg,#d10000,#7a0000);
color:white;
text-align:center;
}

.hero h1{
font-size:52px;
margin-bottom:15px;
}

.hero p{
max-width:700px;
margin:auto;
font-size:18px;
}

/* CARD */

.container{
max-width:1000px;
margin:40px auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.section-title{
margin:30px 0 20px;
padding-bottom:10px;
border-bottom:2px solid #eee;
color:var(--primary);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input,
select,
textarea{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--primary);
box-shadow:0 0 10px rgba(209,0,0,.15);
}

textarea{
resize:vertical;
}

.submit-btn{
width:100%;
padding:16px;
border:none;
background:var(--primary);
color:white;
font-size:18px;
font-weight:600;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

.submit-btn:hover{
opacity:.9;
}

.footer{
margin-top:50px;
background:#111;
color:white;
text-align:center;
padding:30px;
}

.footer p{
margin-top:10px;
opacity:.8;
}

@media(max-width:768px){

.hero h1{
font-size:36px;
}

.grid{
grid-template-columns:1fr;
}

.container{
margin:20px;
padding:25px;
}

.logo img{
height:50px;
}

}

</style>
</head>

<body>

<section class="hero">

<h1>ALPHA AURON RECRUITMENT</h1>

<p>
Join Alpha Auron Private Limited and become part of our growing freelancer network.
</p>

</section>

<div class="container">

<form id="applicationForm">

<h2 class="section-title">Personal Details</h2>

<div class="grid">

<div class="form-group">
<label>Full Name *</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Father Name *</label>
<input type="text" name="father_name" required>
</div>

<div class="form-group">
<label>Mother Name *</label>
<input type="text" name="mother_name" required>
</div>

<div class="form-group">
<label>Mobile Number *</label>
<input type="tel" name="mobile" required>
</div>

<div class="form-group">
<label>Alternative Contact</label>
<input type="tel" name="alt_mobile">
</div>

<div class="form-group">
<label>Personal Email *</label>
<input type="email" name="personal_email" required>
</div>

<div class="form-group">
<label>Alternative Email</label>
<input type="email" name="alt_email">
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" name="dob">
</div>

</div>

<div class="form-group">
<label>Full Address *</label>
<textarea name="address" rows="4" required></textarea>
</div>

<h2 class="section-title">Academic Details</h2>

<div class="grid">

<div class="form-group">
<label>School Name</label>
<input type="text" name="school_name">
</div>

<div class="form-group">
<label>SSC Marks</label>
<input type="text" name="ssc_marks">
</div>

<div class="form-group">
<label>SSC Percentage</label>
<input type="text" name="ssc_percentage">
</div>

<div class="form-group">
<label>College Name</label>
<input type="text" name="college_name">
</div>

<div class="form-group">
<label>PUC Percentage</label>
<input type="text" name="puc_percentage">
</div>

<div class="form-group">
<label>Course</label>
<input type="text" name="course">
</div>

</div>

<h2 class="section-title">Position</h2>

<div class="form-group">

<label>Select Position *</label>

<select name="position" required>

<option value="">Select Position</option>

<option value="FLR">
FLR - Freelancer
</option>

<option value="VFL">
VFL - Verified Freelancer
</option>

<option value="PFL">
PFL - Professional Freelancer
</option>

<option value="SFL">
SFL - Senior Freelancer
</option>

</select>

</div>

<h2 class="section-title">Skills & Interests</h2>

<div class="form-group">
<label>Technical Skills</label>
<textarea rows="5" name="skills"></textarea>
</div>

<div class="form-group">
<label>Hobbies & Interests</label>
<textarea rows="5" name="hobbies"></textarea>
</div>

<button type="submit" class="submit-btn">
Submit Application
</button>

</form>

</div>

<footer class="footer">

<h3>ALPHA AURON PRIVATE LIMITED</h3>

<p>contact@alphaauron.com</p>

<p>© 2026 Alpha Auron. All Rights Reserved.</p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init({
publicKey:"0EXFtV9KEAiw-Qwyg"
});

document.getElementById("applicationForm")
.addEventListener("submit",function(e){

e.preventDefault();

const btn=document.querySelector(".submit-btn");

btn.innerHTML="Submitting...";
btn.disabled=true;

emailjs.sendForm(
"service_j6mkcvi",
"template_9w8a07k",
this
)

.then(()=>{

alert("Application Submitted Successfully!");

this.reset();

btn.innerHTML="Submit Application";
btn.disabled=false;

})

.catch((error)=>{

console.log(error);

alert("Submission Failed!");

btn.innerHTML="Submit Application";
btn.disabled=false;

});

});

</script>

</body>
</html>
